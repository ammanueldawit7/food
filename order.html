<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order</title>
    <link rel="stylesheet" href="order.css">
</head>
<body>
    <nav>
            <a href="home.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="order.html">Order</a>
            <a href="#footer">Contact</a>
            <a href="login.html">Login</a>
            <div class="cart-btn" onclick="openCart()">
            🛒 Cart (<span id="cart-count">0</span>)
            </div>
            </nav>
    <div id="delivery" class="delivery-section">
        <h2>Delivery Form</h2>
        <div class ="form Group">
           <select>
            <option>Select Order Type</option>
            <option>Pickup</option>
            <option>Delivery</option>
           </select>
            
           </div>
       
             <div class ="form Group" style="text-align: end;">
            <select> 
                <option>Select Payment Method</option>
                <option>cash on delivery</option>
                <option>credit/debit card</option>

                <option>Mobile Payment</option> 
            </select>
            
            
           </div>
        <form onsubmit="submitDelivery(event)">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required placeholder="Please enter your full name">
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" required placeholder="For example: 0911223344">
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" rows="3" required placeholder="Please enter your full address"></textarea>
            </div>
    
            
           </div>
           
           

            <button type="submit" class="submit-delivery-btn">Check Out</button>
        </form>
    </div>

      <script>
        let cartCount = 0;

        function addToCart(foodName) {
            cartCount++;
            document.getElementById('cart-count').innerText = cartCount;
            alert(foodName + " has been added to your cart! 🛵");
        }

        function openCart() {
            alert("You have " + cartCount + " items in your cart. Please fill out the delivery form below to place your order.");
        }
        function filterMenu() {
    let input = document.getElementById('searchInput').value.toLowerCase();
    let cards = document.getElementsByClassName('menu-card');

    for (let i = 0; i < cards.length; i++) {
        let title = cards[i].getElementsByTagName('h3')[0].innerText.toLowerCase();
        if (title.includes(input)) {
            cards[i].style.display = "";
        } else {
            cards[i].style.display = "none";
        }
    }
}

        function submitDelivery(event) {
            event.preventDefault();
            let name = document.getElementById('name').value;
            if(cartCount === 0) {
                alert("Please select at least one item before submitting your order.");
            } else {
                alert("Thank you " + name + "! Your order has been received successfully, we will contact you shortly. 🚀");
                location.reload(); // page refresh to reset
            }
        }
    </script>
</body>
</html>
