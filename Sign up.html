<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <form onsubmit="SubmitPassword(event)">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required placeholder="Please enter your full name">
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required placeholder="Please enter a Username">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="text" id="eamil" required placeholder="For example: johndoe@gmail.com">
            </div>
            <div class="form-group">
                <label for="Password">Password</label>
                <textarea id="Password" rows="3" required placeholder="Please Enter Your Password"></textarea>
            </div>
            <div class="form-group">
                <label for="Password"></label>
                <textarea id="Password" rows="3" required placeholder="Please Renter Your Password"></textarea>
            </div>
    
            
           </div>
           
           
            
            <button type="submit" class="submit-delivery-btn">Sign up</button>
        </form>
</body>
</html>
